name: Format check

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.gitignore'
      - 'LICENSE'
      - '*.md'
      - '*.txt'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '.gitignore'
      - 'LICENSE'
      - '*.md'
      - '*.txt'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Checkout and run check
    env:
      MVN: ./mvnw --show-version --batch-mode --no-transfer-progress
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        name: checkout

      - uses: actions/setup-java@v6
        name: Set up JDK 21
        with:
          distribution: "temurin"
          java-version: 21
          cache: 'maven'

      - name: Format check
        run: $MVN formatter:validate
