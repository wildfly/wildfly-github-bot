name: Java CI - Polling tests

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.gitignore'
      - 'LICENSE'
      - '*.md'
      - '*.txt'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '.gitignore'
      - 'LICENSE'
      - '*.md'
      - '*.txt'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: JDK ${{matrix.java-version}} JVM build and tests for polling profile
    env:
      MVN: ./mvnw --show-version --batch-mode --no-transfer-progress
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        java-version: [21]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      name: checkout

    - uses: actions/setup-java@v6
      name: Set up JDK ${{ matrix.java-version }}
      with:
        distribution: "temurin"
        java-version: ${{ matrix.java-version }}
        cache: 'maven'

    # order is important, test profile should be last to override polling's configuration
    - name: Build with Maven
      run: $MVN test -Dquarkus.test.profile=polling,test
