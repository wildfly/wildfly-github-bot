wildfly:
  projectKey: "WFCORE"    # Abbreviation for project, used for title, commit check. By default, this setting is set to "WFLY"

  skip:                   # Regex patterns to skip format checks and/or rule activation (case insensitive)
    format:               # Patterns to skip format checks
      title:              # Patterns matched against PR title. Accepts a single value or a list
        - "\\[skip format\\]"
        - "^Revert \".+\"$"
      body:               # Patterns matched against PR body. Accepts a single value or a list
        - "(?i)no\\s+(?:jira|issue)\\s+(?:required|needed)"
    rules:                # Patterns to skip rule activation
      title:              # Patterns matched against PR title. Accepts a single value or a list
        - "^Pulls$"
      body:               # Patterns matched against PR body. Accepts a single value or a list
        - "(?i)no\\s+review\\s+(?:required|needed)"

  rules:                  # List of objects with no mandatory fields. The rule is fired if at least one check is satisfied. The object is as follows
    - id: id-1            # Each rule should have unique id
      title: "resteasy"   # String looked-up in the title of the Pull Request
      notify:             # List of users to notify with a `/cc` comment
        - random-person
        - random-person-2
    - id: id-2
      body: "hibernate"   # String looked-up in the body of the Pull Request
      notify: [ random-person ]

    - id: id-3
      titleBody: "health"                                       # String looked-up either in the title, the body or both
      directories: [ src/main/, src/test/org/acme/resources/* ] # List of directories. Matches at least one file found changed by the Pull Request
      notify: [ another-random-person ]

  format:                 # Validation check for a correct format of the Pull Request
    title:                                      # Enabled by default. You have to disable explicitly.
      enabled: false                            # If check enabled. By default, this setting is set to true
      failMessage: "Wrong content of the title" # Message displayed when the check fails

    description:
      regexes:            # List of objects, where the object is as follows:
        - pattern: "JIRA:\\s+https://redhat.atlassian.net/browse/WFLY-\\d+|https://redhat.atlassian.net/browse/WFLY-\\d+"   # Regex pattern must be matched by the title
          failMessage: "The PR description must contain a link to the JIRA issue"                                     # Message to display if check does not succeed
      failMessage: "The PR description is not correct"                                                                # Default message to display if a object is missing message field

    commit:                                     # Enabled by default. You have to disable explicitly.
      enabled: true                             # If check enabled. By default, this setting is set to true
      failMessage: "Wrong commit message!"      # Message displayed when the check fails

  emails:     # List of email addresses, which will receive updates from this app
    - random-person@bar.baz
    - another-random-person@gmail.com